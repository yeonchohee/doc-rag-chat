<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA 라우팅: 경로를 sessionStorage에 저장 후 루트로 리다이렉트
      var path = location.pathname.replace(/^\/doc-rag-chat/, '') + location.search + location.hash
      sessionStorage.setItem('spa_redirect', path || '/')
    </script>
    <meta http-equiv="refresh" content="0;URL='/doc-rag-chat/'" />
  </head>
</html>
